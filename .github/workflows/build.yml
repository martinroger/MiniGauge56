name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      # bmwp2000 and twai_daemon are git dependencies in private repos; the
      # component manager clones them over HTTPS, so hand git a token.
      - name: Authenticate git for private components
        env:
          PRIVATE_REPOS_TOKEN: ${{ secrets.PRIVATE_REPOS_TOKEN }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://x-access-token:${PRIVATE_REPOS_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
